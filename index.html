<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convites Premium | Administração</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#34263d;background:#f7f3fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e6dbea;padding:18px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}h2{font-size:19px}main{max-width:1100px;margin:35px auto;padding:0 20px}.card{background:white;border:1px solid #e8ddeb;border-radius:18px;padding:22px;box-shadow:0 5px 20px #38204609}.login{max-width:420px;margin:70px auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}input{display:block;width:100%;padding:13px;border:1px solid #d8c7de;border-radius:10px;margin:10px 0;font:inherit}button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:#6c3f85;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#f1e7f5;color:#5d3177}.danger{background:#a93149}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.muted{color:#7b6b82;font-size:14px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}.photo-item{min-width:0}.delete-photo{display:block;width:100%;margin-top:7px;padding:8px 5px;font-size:13px}.photo{display:block}.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.photo small{display:block;overflow-wrap:anywhere}.hidden{display:none!important}#msg{margin:15px 0;color:#7b3e75;white-space:pre-wrap}.event h3{margin:0 0 8px}.event button{margin:5px 5px 0 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.overlay{position:fixed;inset:0;background:#2113288c;display:grid;place-items:center;padding:20px}.dialog{background:white;border-radius:18px;padding:25px;max-width:430px;width:100%}a{color:#6c3f85}#gallery{margin-top:20px}
</style></head><body><header><h1>✦ Convites Premium <span class="muted">| Admin</span></h1><button id="logout" class="secondary hidden">Sair</button></header><main><section id="login" class="card login"><h2>Acesso administrativo</h2><p class="muted">Entre com sua conta autorizada no Supabase.</p><form id="loginForm"><input id="email" type="email" placeholder="E-mail" required autocomplete="username"><input id="password" type="password" placeholder="Senha" required autocomplete="current-password"><button type="submit">Entrar</button></form></section><section id="app" class="hidden"><div class="row"><div><h2>Meus álbuns</h2><p class="muted">Gerencie eventos e fotos em um único painel.</p></div><button id="newEvent">+ Novo evento</button></div><div id="events" class="grid"></div><section id="gallery" class="card hidden"><div class="row"><h2 id="galleryTitle">Fotos</h2><button id="closeGallery" class="secondary">Fechar</button></div><div class="toolbar"><span id="photoCount"></span><button id="download">Baixar fotos em ZIP</button><button id="deleteEvent" class="danger">Excluir evento e fotos</button></div><div id="photos" class="photos"></div></section></section><p id="msg" role="status"></p></main><div id="modal" class="overlay hidden"><div class="dialog"><h2>Criar evento</h2><form id="eventForm"><input id="eventName" placeholder="Nome do evento (ex.: Alicya — 15 anos)" required><input id="eventId" placeholder="ID do álbum (ex.: alicya-15-anos)" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" title="Use letras minúsculas, números e hífens"><small class="muted">Para álbuns existentes, use exatamente o eventoId do config.js.</small><input id="eventDate" type="date"><button type="submit">Criar</button> <button id="cancel" class="secondary" type="button">Cancelar</button></form></div></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="app.js"></script></body></html>
